name: mcp-sentinel

x-database-env: &database-env
  POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
  POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}

services:
  db:
    build: ./database
    image: mcp-sentinel-db:pg17-vector
    environment:
      <<: *database-env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      <<: *database-env
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4.1-mini}
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-8501}:8501"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  importer:
    build:
      context: .
      dockerfile: scripts/Dockerfile
    profiles: ["tools"]
    environment:
      <<: *database-env
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    volumes:
      - ./data:/srv/data:ro
    depends_on:
      db:
        condition: service_healthy

  analytics:
    build:
      context: .
      dockerfile: analytics/Dockerfile
    profiles: ["tools"]
    environment:
      <<: *database-env
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    volumes:
      - ./data:/srv/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
